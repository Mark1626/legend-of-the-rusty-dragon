[package]
name = "dragon-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serverless hosting layer for Legend of the Pink Dragon"

[dependencies]
dragon-core = { path = "../dragon-core" }

anyhow = "1"
axum = "0.8"
getrandom = "0.4"
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
# Token digests are stored, so a change of hash implementation would lock every
# player out at once. The remedy is a pinned vetted crate, not a hand-rolled
# one: `=` holds the exact version until the digests are deliberately migrated.
sha2 = "=0.11.0"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "json",
    "chrono",
] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "dragon-server"
path = "src/main.rs"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
